name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: hacking-llms-shared
          environment-file: shared/python/environment.yml
          auto-activate-base: false
          use-only-tar-bz2: true

      - name: Show Python Version
        run: python --version

      - name: Run Unit Tests
        run: make test

      - name: Run Demo Hub Tests
        run: make test-hub
